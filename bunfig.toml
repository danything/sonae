[fmt]
# import を並べ替える (副作用だけの import は順を変えない)
sortImports = true
ignorePatterns = [
  # SOPS が書くファイル (sops edit のたびにインデント 4 で書き直す)
  "deploy/*.sops.yaml",
  # Helm のテンプレートは Go のテンプレートで、YAML として読めない
  "charts/*/templates/",
  # 気象庁のサンプル電文などの写し。中身を変えない
  "tests/fixtures/**",
  # 気象庁のデータから tools/areas/・tools/stations/・tools/volcanoes/ で作るもの
  "static/areas/**",
  # 国土地理院のスタイルとスプライトから tools/gsi/build.ts で作るもの
  "static/map/gsi/**",
  # プレート境界 (PB2002) から tools/plates/build.sh で作るもの
  "static/plates/*.geojson",
]
