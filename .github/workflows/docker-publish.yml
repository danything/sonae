name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # **イメージの中身に関わらない変更では組まず、image.tag も差し替えない。** 本番は Recreate なので、
    # 差し替えるたびに数秒つながらない (docs/design.md の 8 章)。
    # 並べるのは「Dockerfile のビルド (`bun run build`) が読まない」と言い切れるものだけ。
    # 分からないもの (新しく足した設定のファイルなど) は組む側に倒す (組みすぎても入れ替わるだけで、
    # 取りこぼすとコードの変更が出ない)。
    # `*.md` はリポジトリの直下だけ (static/ の下の .md は build/ に入る)。
    # **release.yml の images ジョブの `git log` の除外と同じものにする**
    paths-ignore:
      # 画像タグを差し替える PR のマージは deploy/ しか変えない。ここで起動しないことで
      # ビルド → 差し替えの PR → マージ → ビルド の輪を止める
      - "deploy/**"
      # chart だけの変更はイメージを変えない (Argo CD が chart を読んで当てる)
      - "charts/**"
      - "docs/**"
      - "tests/**"
      # 下地のデータを作る道具。作ったもの (static/ の下) はイメージに入るので、そちらの変更で組む
      - "tools/**"
      - "*.md"
      - "LICENSE"
      - ".github/**"
      - "install.sh"
      - "install.ps1"
      - "compose*.yml"
      - "renovate.json"
  workflow_dispatch:

# 続けてマージしたときは、いちばん新しいコミットだけを出せばよいので、古い実行は取り消す
concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # 差し替えの PR が自分の必須のチェックを書くため (下の段)
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 出すのは、deploy/application.yaml (Helm chart の Application) の helm.valuesObject の image.tag を
      # 差し替える PR を作って自分でマージすることで行う (ashi と同じ形)。GITHUB_TOKEN で作った PR は
      # ワークフローを起こさないので、必須のチェック (check・build) はここで書く。差し替えるのは画像タグだけで、
      # その画像は上の段で組んで push 済み
      - name: Open and self-merge PR to update the image tag
        run: |
          set -eu
          file=deploy/application.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bump-sonae-image"
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # 書き換えるのは「tag: <40 桁の sha>」の行だけ。VOICEVOX のタグ (バージョン) は chart の values.yaml にあり、
          # 形が違うので当たらない。values はインラインなのでインデントは深い。行頭の空白は幾つでも許す。
          # 1 行でなければ、どこを書くか分からないので止める
          pattern='^ +tag: [0-9a-f]{40}$'
          count=$(grep -cE "$pattern" "$file" || true)
          if [ "$count" != "1" ]; then
            echo "$file の image.tag (40 桁の sha) が 1 行ではありません (${count} 行)" >&2
            exit 1
          fi
          sed -i -E "s#^( +tag:) [0-9a-f]{40}\$#\1 ${GITHUB_SHA}#" "$file"
          if git diff --quiet -- "$file"; then
            echo "$file already points at ${GITHUB_SHA}; nothing to deploy"
            exit 0
          fi
          git add "$file"
          git commit -m "chore: update sonae image to ${GITHUB_SHA}"
          git push --force origin "$branch"
          title="chore: update sonae image to ${GITHUB_SHA::7}"
          body="Automated image tag bump for commit ${GITHUB_SHA}. Merges itself once the checks below are reported."
          gh pr create --base main --head "$branch" --title "$title" --body "$body" \
            || gh pr edit "$branch" --title "$title" --body "$body"

          for context in check build; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
              -f state=success \
              -f context="$context" \
              -f description="deploy-only bump; image built by this run" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

          # マージは squash だけ許してある
          gh pr merge "$branch" --squash || gh pr merge "$branch" --auto --squash
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
