<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <meta name="theme-color" content="#0b0c0f" />
    <script>
      // 描く前にテーマを当てる (denpa と同じ。保存が無ければ暗いテーマ)。
      // 端末の控えを読めないとき (サイトのデータを止めた Safari などで投げる) も既定のまま
      (() => {
        // スマホの形 (上のヘッダーを出さず、下のタブ) の印。条件は `#lib/phone-form.ts` と同じ。
        // 描く前に付け、当たり外れが変わるたびに付け直す (向きを変えた・窓の幅を変えた)
        const phone = matchMedia("(max-width: 999.98px)");
        const markPhone = () =>
          document.documentElement.toggleAttribute("data-phone", phone.matches);
        markPhone();
        phone.addEventListener("change", markPhone);
        let saved = null;
        try {
          saved = localStorage.getItem("sonae.theme");
        } catch {
          // 既定のまま
        }
        const mode = saved === "light" || saved === "system" ? saved : "dark";
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themeMode = mode;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", dark ? "#0b0c0f" : "#ffffff");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
