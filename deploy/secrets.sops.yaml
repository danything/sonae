# sonae の namespace の秘密。
#   sonae-secrets:
#     oidc-client-secret  必須。Entra の共用のアプリ登録 Main のシークレット (ashi の entra-client-secret・gitops の auth などと同じ値。変えるときは全部)
#     vapid-private-jwk   任意。Web Push の VAPID の秘密鍵 (JWK の JSON)。無ければ Web Push を切って動く。作り方と入れ方は docs/push.md
#   volsync-<pvc>: VolSync の restic の Secret (danything/gitops の deploy/backup/secrets.sops.yaml と同じ R2 の資格情報とパスワードで、リポジトリだけ PVC ごと)
# 値は SOPS で暗号化してある (../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは管理者の鍵で `sops edit deploy/secrets.sops.yaml` して push する
# (gitops の tools/t sops edit でもよい)。クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
