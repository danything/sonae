# 公開経路。**Cilium Gateway (danything/gitops の bootstrap/gateway/) に付ける HTTPRoute。**
# 証明書は Gateway 側のリスナーに cert-manager がワイルドカードで発行したものが付いているので、
# ここでは指定しない。DNS も Cloudflare の *.doany.io のワイルドカード (プロキシ経由) で引けるので、レコードは足さない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonae
  namespace: sonae
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["s.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sonae
          port: 3000
