{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.enabled のときは ingress.hosts が要ります" }}
{{- end }}
# 標準の Ingress。**認証は sonae 自身がやる** (OIDC) ので、前段は名前を届けるだけ
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonae
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonae.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonae
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
