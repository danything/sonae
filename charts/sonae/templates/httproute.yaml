{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled のときは httpRoute.parentRefs が要ります (HTTPRoute は自分では待ち受けを持たないため)" }}
{{- end }}
# Gateway API の HTTPRoute。**認証は sonae 自身がやる** (OIDC。docs/design.md の 2.6) ので、前段は名前を届けるだけ。
# 証明書は Gateway 側のリスナーが持つので、ここでは指定しない
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonae
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonae.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # group / kind / weight は API サーバが既定値を入れる。**明示的に書いておく。**
  # 省くと「書いたもの」と「クラスタにあるもの」が食い違い、Argo CD が ServerSideApply のとき
  # OutOfSync のままになる (denpa で起きた)
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: {{ .group | default "gateway.networking.k8s.io" }}
      kind: {{ .kind | default "Gateway" }}
      name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with (include "sonae.hostnames" . | fromJsonArray) }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sonae
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
